<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practica formularios</title>
</head>
<body>
    
    <h1>Practica de formularios</h1><br>

    <h3>Formulario 1</h3>
    <form>
        <fieldset>
            <legend>Completar</legend>
        <label for="color">Elegir un color:</label>
        <input type="color" id="color">

        <textarea name="textarea" id="textarea" placeholder="Por favor, escribe aqui" rows="5" cols="53"></textarea>

        <label for="lenguaje"></label>
        <select name="lenguaje" id="lenguaje">
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="visual_basic">Visual basic</option>
        </select><BR></BR>

        <input type="checkbox">ASIR
        <input type="checkbox">DAM
        <input type="checkbox">DAW
        </fieldset>

        <fieldset>
            <legend>Rellene las opciones seguientes</legend>
            <label for="fecha">Elija una fecha:</label>
            <input type="date" id="fecha" name="fecha"><br>

            <label for="ficheros">Elija un fichero:</label>
            <input type="file" id="ficheros" name="ficheros">

           <select name="ciclo" id="ciclo" name="ciclo" multiple size="4">
            <option value="smir">SMIR</option>
            <option value="asir">ASIR</option>
            <option value="dam">DAM</option>
            <option value="daw">DAW</option>
           </select>
        </fieldset>

    </form><br>

    <h3>Formulario 3</h3>
    <form>
        <fieldset>
            <legend>Rellenar</legend>

            <input type="radio" name="asignaturas" value="asignaturalengua">Lengua
            <input type="radio" name="asignaturas" value="asignaturamatematicas">Matemáticas
            <input type="radio" name="asignaturas" value="asignaturahistoria">Historia
            <input type="radio" name="asignaturas" value="asignaturageografia">Geografía

            <input type="checkbox" name="editor">

        </fieldset>



    </form>


</body>
</html>

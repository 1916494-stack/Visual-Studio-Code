<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practica formularios</title>
</head>
<body>
    
    <h1>Practica de formularios</h1><br>

    <h3>Formulario 1</h3>
    <form>
        <fieldset>
            <legend>Completar</legend>
        <label for="color">Elegir un color:</label><br>
        <input type="color" id="color"><br>

        <textarea name="textarea" id="textarea" placeholder="Por favor, escribe aqui" rows="5" cols="53"></textarea>

        <label for="lenguaje"></label><br>
        <select name="lenguaje" id="lenguaje">
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="visual_basic">Visual basic</option>
        </select><br>

        <input type="checkbox">ASIR
        <input type="checkbox">DAM
        <input type="checkbox">DAW
        </fieldset>

        <fieldset>
            <legend>Rellene las opciones seguientes</legend>
            <label for="fecha">Elija una fecha:</label>
            <input type="date" id="fecha" name="fecha"><br>

            <label for="ficheros">Elija un fichero:</label>
            <input type="file" id="ficheros" name="ficheros">

           <select name="ciclo" id="ciclo" name="ciclo" multiple size="4">
            <option value="smir">SMIR</option>
            <option value="asir">ASIR</option>
            <option value="dam">DAM</option>
            <option value="daw">DAW</option>
           </select>
        </fieldset>

    </form><br>

    <h3>Formulario 2</h3>
    <form>
        <fieldset>
            <legend>Rellenar</legend>

            <input type="radio" name="asignaturas" value="asignaturalengua">Lengua
            <br>
            <input type="radio" name="asignaturas" value="asignaturamatematicas">Matemáticas
            <br>
            <input type="radio" name="asignaturas" value="asignaturahistoria">Historia
            <br>
            <input type="radio" name="asignaturas" value="asignaturageografia">Geografía
            

            <br><br>
            <input type="checkbox" name="editor">Notepad
            <input type="checkbox" name="editor">Emacs
            <input type="checkbox" name="editor">Otro

            <br>
            <textarea name="textarea" id="textarea" placeholder="Por favor, escribe aqui" rows="5" cols="53"></textarea>

            <br>
            <select name="procesador" id="procesador">
            <option value="amd">AMD</option>
            <option value="intel_i5">Intel i5</option>
            <option value="intel_i7">Intel i7</option>
            </select>

        </fieldset>

    </form>
    
    <br>

    <h3>Formulario 3</h3>
    <form>

        <fieldset>
            <legend>Rellenar</legend>

            <input type="radio" name="asignatura" value="asignaturageografia">Geografía
            <input type="radio" name="asignatura" value="asignaturalengua">Lengua
            <input type="radio" name="asignatura" value="asignaturamatematicas">Matemáticas
            <input type="radio" name="asignatura" value="asignaturahistoria">Historia

            <br><br>

            <label for="hora">Elija una hora :</label>
            <input type="time" id="hora" name="hora">

            <br><br>

            <input type="checkbox" name="idioma">Español
            <br>
            <input type="checkbox" name="idioma">Inglés
            <br>
            <input type="checkbox" name="idioma">Alemán
            <br>
            <input type="checkbox" name="idioma">Francés

            <br>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">

            <br>
            
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos">







        

    </form>


</body>
</html>
